name: build

# One pipeline: build/test on every PR and every push to main; release runs
# ONLY after the test matrix passes (release job `needs: test`), and only on
# push to main or manual dispatch — never on PRs.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Black
      run: |
        python -m pip install --upgrade pip
        pip install black

    - name: Check for existing release
      run: |
        VERSION=$(python -c "
        try:
            import tomllib
        except ImportError:
            import tomli as tomllib
        with open('pyproject.toml', 'rb') as f:
            print(tomllib.load(f)['project']['version'])
        ")
        echo "Checking for existing release v$VERSION"
        if gh release view "v$VERSION" >/dev/null 2>&1; then
          echo "::error::Release v$VERSION already exists. Please bump the version in pyproject.toml"
          exit 1
        else
          echo "Version v$VERSION is available"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Auto-format with Black
      run: |
        black ./engforge
        if ! git diff --quiet; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto-format code with Black [skip ci]" || exit 0
          git push origin HEAD:${{ github.head_ref }}
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: [format]
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: ${{ github.head_ref || github.ref }}

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest black
        pip install -e .[all]

    # Transitional (until the engforge-structures split, docs/ENGFORGE_1.0.md):
    # the eng extra's sectionproperties~=3.1.2 has no py3.12 release, and
    # 3.2+ requires numpy>=2. Install current eng deps, then pin numpy back
    # below 2 — runtime-compatible even though the resolver disagrees.
    - name: Install eng deps on 3.12
      if: matrix.python-version == '3.12'
      run: |
        pip install sectionproperties PyNiteFEA CoolProp fluids control
        pip install "numpy>=1.26,<2"

    - name: Check Python & Run Tests
      run: |
        python -c "import sys; print(sys.version)"
        python -m pip list | grep -i PyNiteFEA || echo "pynite-not-found"
        python -m pip list | grep -i coolprop || echo "coolprop-not-found"
        python -m unittest discover -s engforge/test -p "test_*.py" -v

  release:
    runs-on: ubuntu-latest
    needs: [test]
    # only ever release from main — push is already main-only via the trigger,
    # but workflow_dispatch can be fired from any branch, so pin the ref too
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        pip install -e .[all]

    - name: Get version
      id: version
      run: |
        VERSION=$(python -c "
        try:
            import tomllib
        except ImportError:
            import tomli as tomllib
        with open('pyproject.toml', 'rb') as f:
            print(tomllib.load(f)['project']['version'])
        ")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Check if release exists
      id: check_release
      run: |
        if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.version.outputs.version }} already exists"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.version.outputs.version }} does not exist"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs/_build/html/'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Build package
      if: steps.check_release.outputs.exists == 'false'
      run: |
        python -m build

    - name: Create GitHub Release
      if: steps.check_release.outputs.exists == 'false'
      run: |
        gh release create "v${{ steps.version.outputs.version }}" \
          --title "Release v${{ steps.version.outputs.version }}" \
          --notes "Automated release for version ${{ steps.version.outputs.version }}" \
          --generate-notes \
          dist/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to PyPI
      if: steps.check_release.outputs.exists == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://upload.pypi.org/legacy/
